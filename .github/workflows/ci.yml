name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            portable: 0
          - os: ubuntu-latest
            portable: 1
          - os: macos-latest
            portable: 0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Show toolchain
        run: cc --version
      - name: Build and run all tests
        run: make -j2 PORTABLE=${{ matrix.portable }} ci
      - name: Offline benchmark smoke test
        run: python3 test/benchmark_release.py --runs 1 --size-mib 2 --output-lines 128
      - name: Test AVX2 when supported by the runner
        if: matrix.os == 'ubuntu-latest' && matrix.portable == 0
        shell: bash
        run: |
          if grep -qw avx2 /proc/cpuinfo; then
            make clean
            make -j2 ci CFLAGS='-Wall -Wextra -O3 -std=c11 -pthread -D_GNU_SOURCE -D_DEFAULT_SOURCE -mavx2' LDFLAGS='-pthread'
          fi

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make sanitize
